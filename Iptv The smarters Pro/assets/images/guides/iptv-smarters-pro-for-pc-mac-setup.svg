<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="PC &amp; Mac Setup">
  <defs>
    <linearGradient id="bg-iptv-smarters-pro-for-pc-mac-setup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d"/>
      <stop offset="55%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>
    <radialGradient id="glow-iptv-smarters-pro-for-pc-mac-setup" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logo-iptv-smarters-pro-for-pc-mac-setup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B3FE4"/>
      <stop offset="100%" stop-color="#5F15CD"/>
    </linearGradient>
    <pattern id="grid-iptv-smarters-pro-for-pc-mac-setup" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-iptv-smarters-pro-for-pc-mac-setup)"/>
  <rect width="1200" height="630" fill="url(#grid-iptv-smarters-pro-for-pc-mac-setup)"/>
  <circle cx="960" cy="120" r="360" fill="url(#glow-iptv-smarters-pro-for-pc-mac-setup)"/>
  <circle cx="180" cy="560" r="300" fill="url(#glow-iptv-smarters-pro-for-pc-mac-setup)" opacity="0.6"/>

  <!-- category pill -->
  <g transform="translate(64,56)">
    <rect width="223.2" height="34" rx="17" fill="#06b6d4" fill-opacity="0.12" stroke="#06b6d4" stroke-opacity="0.4"/>
    <circle cx="18" cy="17" r="4" fill="#67e8f9"/>
    <text x="32" y="22" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="13"
          letter-spacing="1.5" fill="#67e8f9">DEVICE SETUP</text>
  </g>

  <!-- icon emblem -->
  <g transform="translate(600,272)">
    <circle r="118" fill="#06b6d4" fill-opacity="0.07" stroke="#06b6d4" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle r="86" fill="#000000" fill-opacity="0.35"/>
    <g transform="scale(4.4)">
    <g transform="translate(-12,-12)" fill="none" stroke="#67e8f9" stroke-width="1.7"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16" />
    </g>
    </g>
  </g>

  <!-- label -->
  <text x="600" y="446" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="42" letter-spacing="-0.5" fill="#ffffff">PC &amp; Mac Setup</text>
  <text x="600" y="484" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="500"
        font-size="18" fill="#71717a" letter-spacing="0.5">IPTV Smarters Pro Guide</text>

  <!-- brand mark -->
  <g transform="translate(1080,548)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="url(#logo-iptv-smarters-pro-for-pc-mac-setup)"/>
    <g transform="translate(9,9)" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 8.5C6.5 7.11929 7.61929 6 9 6H17C18.3807 6 19.5 7.11929 19.5 8.5V16.5C19.5 17.8807 18.3807 19 17 19H9C7.61929 19 6.5 17.8807 6.5 16.5V8.5Z"/>
      <path d="M11.5 9.5L15.5 12L11.5 14.5V9.5Z" fill="#ffffff" stroke="none"/>
    </g>
  </g>
